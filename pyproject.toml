[project]
name = "portfolyo"
version = "0.6.7"
description = "Analyse and manipulate timeseries related to power and gas offtake portfolios"
readme = "README.rst"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Ruud Wijtvliet", email = "rwijtvliet@gmail.com" },
  { name = "Sakshi Singh", email = "sakshisingh1809@gmail.com" },
  { name = "Alina Voilova", email = "voilova.alina@gmail.com" },
]
dependencies = [
  "pandas>=2.2",
  "matplotlib>=3.7.2",
  "pint>=0.24",
  "pint-pandas>=0.6.2",
  "colorama>=0.4.6",
  "numpy>=1.26.2",
]

[project.optional-dependencies]
test = [
  "codecov>=2.1.13",
  "pytest>=8",
  "coverage>=7.3.0",
  "pytest-cov>=4.1.0",
  "pyyaml>=6.0.1",
  "openpyxl>=3.1.2",
]
docs = [
  "sphinx>=7.2.6",
  "sphinx-autobuild>=2021.3.14",
  "matplotlib>=3.8.2",
  "numpydoc>=1.6.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-exec-code>=0.12",
  "sphinx-rtd-theme>=1.3.0",
  "insegel>=1.3.1",
  "nbsphinx>=0.9.3",
  "pandoc>=2.3",
  "pip-tools>=7.4.1",
  "IPython>=8.23.0",
]
dev = [
  "black>=23.7.0",
  "pre-commit>=3.4.0",
  "ipykernel>=6.25.2",
  "importlib-metadata>=4.8",
  "debugpy>=1.8.6",
  "snakeviz>=2.2.2",
  "pandas-stubs>=2.2.3.250308",
  "ruff>=0.11.6",
  "isort>=6.0.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# --- Tool Configurations ---

[tool.uv]
managed = true
package = true

[tool.pytest.ini_options]
markers = [
  "only_on_pr: marks tests as slow (select with -m only_on_pr and deselect with -m 'not only_on_pr')",
]
pythonpath = ["tests"]
testpaths = ["tests/toolsb/"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = ["__init__.py", "versioneer.py", "_version.py", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E202", "E226"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.numpydoc_validation]
checks = ["all", "EX01", "SA01", "ES01"]
